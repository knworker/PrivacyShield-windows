name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build PrivacyShield.exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile with csc
        shell: cmd
        run: |
          C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe /nologo /target:winexe /optimize+ /out:PrivacyShield.exe PrivacyShield.cs

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrivacyShield
          path: PrivacyShield.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PrivacyShield.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
